<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Simulasi TO UTBK</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#f2f2f2;font-family:'Manrope',system-ui,sans-serif;color:#111;padding:12px}
.app{max-width:1180px;margin:0 auto;display:flex;background:#fff;border-radius:10px;box-shadow:0 1px 6px rgba(0,0,0,.08);overflow:hidden;min-height:620px}
.side{width:300px;flex:none;background:#f7f7f8;padding:56px 20px 24px;text-align:center}
.av{width:84px;height:84px;margin:0 auto;background:#3a86cc;border:1px solid #1d4f82;border-radius:6px;color:#fff;font-size:56px;line-height:84px;font-weight:500}
.nm{font-size:20px;font-weight:600;margin-top:28px}
.em{font-size:13px;margin-top:10px}
.to{font-size:16px;font-weight:600;margin-top:36px}
.sub{font-size:13px;margin-top:14px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:18px 14px;margin:36px auto 0;width:max-content}
.nb{position:relative;width:40px;height:40px;border:1.5px solid #333;border-radius:7px;background:#fff;font:500 15px 'Manrope',sans-serif;box-shadow:0 2px 4px rgba(0,0,0,.18);cursor:pointer;padding:0;color:#111}
.nb .b{position:absolute;top:-8px;right:-8px;width:18px;height:18px;border-radius:50%;background:#8e8e8e;color:#fff;font-size:11px;line-height:18px;font-weight:700}
.nb.done{background:#3fbf6b;border-color:#228a49;color:#fff}
.nb.done .b{background:#1f9d4d}
.nb.cur{background:#4a7de8;border-color:#2f5fc7;color:#fff}
.nb.cur.done{background:#3fbf6b;border-color:#228a49;outline:3px solid #4a7de8;outline-offset:1px}
.nb.mark::after{content:"";position:absolute;left:-1px;bottom:-1px;width:0;height:0;border-left:12px solid #f5a623;border-top:12px solid transparent;border-bottom-left-radius:6px}
.sc{margin-top:36px;font-size:26px;font-weight:600;line-height:1.35}
.fin{margin-top:22px;font:600 15px 'Manrope',sans-serif;padding:11px 18px;border-radius:8px;border:0;background:#4a7de8;color:#fff;cursor:pointer;width:100%}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:104px;border-bottom:1px solid #e4e4e4;position:relative;text-align:center;padding-top:20px;flex:none}
.top small{font-size:14px;display:block}
.top b{font-size:26px;font-weight:600;display:block;margin-top:6px}
.bm{position:absolute;left:38px;top:20px;background:none;border:0;cursor:pointer;padding:0}
.bm svg{width:40px;height:44px}
.ed{z-index:2;position:absolute;right:24px;top:30px;font:600 14px 'Manrope',sans-serif;padding:8px 14px;border-radius:8px;border:1.5px solid #999;background:#fff;color:#444;cursor:pointer}
.body{padding:48px 68px 28px;flex:1}
.txt{text-align:justify;font-size:17.5px;line-height:1.65;margin:0 0 48px}
.q{font-size:17.5px;margin:0 0 28px}
.o{display:flex;align-items:center;gap:16px;font-size:19px;padding:13px 0;cursor:pointer;user-select:none}
.r{width:28px;height:28px;border:2px solid #bbb;border-radius:50%;flex:none;position:relative}
.o.sel .r{border-color:#4a7de8}
.o.sel .r::after{content:"";position:absolute;inset:5px;background:#4a7de8;border-radius:50%}
.nav{display:flex;justify-content:space-between;padding:0 68px 32px}
.nav button,.btn{font:600 15px 'Manrope',sans-serif;padding:10px 22px;border-radius:8px;border:1.5px solid #4a7de8;background:#fff;color:#4a7de8;cursor:pointer}
.btn.p,.nav button.p{background:#4a7de8;color:#fff}
.nav button:disabled{opacity:.35;cursor:default}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.f label,.lb{font-size:13px;font-weight:600;color:#555;display:block}
.f input{width:100%;margin-top:5px;padding:9px 11px;border:1px solid #ccc;border-radius:7px;font:15px 'Manrope',sans-serif}
textarea{width:100%;height:340px;margin-top:6px;padding:12px;border:1px solid #ccc;border-radius:8px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.gd{font-size:13px;color:#666;line-height:1.55;margin:10px 0 16px;background:#f7f7f8;padding:10px 14px;border-radius:8px}
.gd code{background:#eaeaec;padding:1px 5px;border-radius:4px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cnt{font-size:13px;color:#666;margin-left:auto}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov.on{display:flex}
.md{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:460px;max-height:90vh;overflow:auto}
.md h3{margin:0 0 6px;font-size:18px}
.md textarea{height:260px}
@media(max-width:820px){
 .app{flex-direction:column}.side{width:100%;padding:28px 16px}.av{width:64px;height:64px;line-height:64px;font-size:42px}
 .nm{margin-top:14px}.to{margin-top:18px}.grid{margin-top:26px}.sc{margin-top:22px;font-size:22px}
 .body{padding:28px 20px}.nav{padding:0 20px 28px}.top{height:84px}.bm{left:16px;top:14px}.ed{right:12px;top:22px;padding:6px 10px;font-size:12px}
 .txt,.q{font-size:16px}.o{font-size:17px}.f{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
 <aside class="side">
  <div class="av" id="av">F</div>
  <div class="nm" id="nm"></div>
  <div class="em" id="em"></div>
  <div class="to" id="to"></div>
  <div class="sub" id="sub"></div>
  <div class="grid" id="grid"></div>
  <div class="sc">Terjawab: <span id="ter">0</span><br>Kosong: <span id="kos">0</span></div>
  <button class="fin" id="fin">Selesai &amp; Salin Jawaban</button>
  <button class="fin" id="ed2" style="background:#fff;color:#4a7de8;border:1.5px solid #4a7de8;margin-top:10px">✎ Atur Soal (input soal)</button>
 </aside>
 <section class="main">
  <div class="top">
   <button class="bm" id="bm" aria-label="Tandai soal"><svg viewBox="0 0 40 44"><path id="bmp" d="M5 3h30v38L20 31 5 41z" fill="none" stroke="#111" stroke-width="4" stroke-linejoin="round"/></svg></button>
   <small>Nomor Soal</small><b id="no">1</b>
   <button class="ed" id="ed">✎ Atur Soal</button>
  </div>
  <div class="body" id="body"></div>
  <div class="nav" id="nav"><button id="pv">← Sebelumnya</button><button class="p" id="nx">Selanjutnya →</button></div>
 </section>
</div>
<div class="ov" id="ov"><div class="md">
 <h3>Jawabanmu</h3>
 <div class="lb">Salin teks ini, lalu tempel ke chat</div>
 <textarea id="res" readonly></textarea>
 <div class="row" style="margin-top:12px"><button class="btn p" id="cp">Salin</button><button class="btn" id="rs">Reset jawaban</button><button class="btn" id="cl">Tutup</button></div>
</div></div>
<script>
var SAMPLE=`Teks: **Bacalah teks berikut untuk menjawab soal nomor 1 sampai dengan 4!**

1) Persona 3 adalah *role playing game* (RPG) revolusioner dari Atlus yang memadukan kehidupan remaja dengan pertarungan supranatural. (2) Pemain merupakan siswa SMA yang bergabung dengan *Specialized Extracurricular Execution Squad* (S.E.E.S.), kelompok pelajar yang menyelidiki fenomena misterius bernama *Dark Hour*. (3) Pada waktu tersembunyi ini, sekolah berubah menjadi Menara Tartarus yang dipenuhi makhluk bernama *shadows*. (4) Untuk melawan mereka, para anggota S.E.E.S memanggil persona. (5) Persona adalah manifestasi kekuatan psikis atau sisi terdalam jiwa yang memberi kemampuan bertarung khusus. (6) Berbagai aktivitas seperti belajar, bersosialisasi, dan membangun relasi sosial dapat membuka jalan bagi perkembangan karakter serta memengaruhi kekuatan persona saat bertarung.
Soal: Kalimat yang mengandung makna lain dari yang tertulis adalah ....
A. kalimat (2)
B. kalimat (3)
C. kalimat (4)
D. kalimat (5)
E. kalimat (6)
---
Teks: =
Soal: Contoh soal kedua dengan bacaan yang sama (cukup tulis "Teks: =").
A. Pilihan A
B. Pilihan B
C. Pilihan C
D. Pilihan D
E. Pilihan E`;
var K='snbtsim2',D={nama:'FAIQ DK',email:'faiqdk07@gmail.com',judul:'TO UTBK 4 - 2026/2027',sub:'Pengetahuan & Pemahaman Umum',raw:SAMPLE,A:[],M:[]};
try{var s=localStorage.getItem(K);if(s)D=Object.assign(D,JSON.parse(s));}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
var $=function(i){return document.getElementById(i)},Q=[],A=[],M=[],cur=0,edit=false;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function fmt(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\n/g,'<br>')}
function parse(raw){
 var out=[],prev='';
 raw.split(/^\s*---+\s*$/m).forEach(function(b){
  var m='',t=[],q=[],o=[];
  b.split('\n').forEach(function(l){
   var r;
   if(r=l.match(/^\s*Teks:\s?(.*)$/i)){m='t';t.push(r[1]);}
   else if(r=l.match(/^\s*Soal:\s?(.*)$/i)){m='q';q.push(r[1]);}
   else if(m!='t'&&m!=''&&(r=l.match(/^\s*([A-Ja-j])[.)]\s+(.*)$/))){m='o';o.push(r[2]);}
   else if(m=='t')t.push(l);
   else if(m=='q')q.push(l);
   else if(m=='o'&&l.trim()&&o.length)o[o.length-1]+=' '+l.trim();
  });
  var qq=q.join('\n').trim();
  if(!qq&&!o.length)return;
  var tt=t.join('\n').trim();
  if(tt=='=')tt=prev;else if(tt)prev=tt;
  out.push({t:tt,q:qq,o:o});
 });
 return out;
}
function load(){
 Q=parse(D.raw);
 A=(D.A&&D.A.length==Q.length)?D.A:Q.map(function(){return-1});
 M=(D.M&&D.M.length==Q.length)?D.M:Q.map(function(){return false});
 if(cur>=Q.length)cur=0;
}
function head(){$('nm').textContent=D.nama;$('em').textContent=D.email;$('to').textContent=D.judul;$('sub').textContent=D.sub;$('av').textContent=(D.nama||'?').charAt(0).toUpperCase()}
function grid(){
 var h='',c=0;
 for(var i=0;i<Q.length;i++){
  if(A[i]>=0)c++;
  h+='<button class="nb'+(A[i]>=0?' done':'')+(i==cur&&!edit?' cur':'')+(M[i]?' mark':'')+'" data-i="'+i+'">'+(i+1)+'<span class="b">'+(A[i]>=0?'✓':'×')+'</span></button>';
 }
 $('grid').innerHTML=h;$('ter').textContent=c;$('kos').textContent=Q.length-c;
}
function soal(){
 head();
 if(edit){editor();grid();return}
 $('nav').style.display='';$('ed').style.display='';
 if(!Q.length){$('body').innerHTML='<p class="q">Belum ada soal. Klik “Atur Soal” untuk menambahkan.</p>';$('no').textContent='–';grid();return}
 var q=Q[cur],h='';
 if(q.t)h+='<p class="txt">'+fmt(q.t)+'</p>';
 h+='<p class="q">'+fmt(q.q)+'</p>';
 q.o.forEach(function(o,n){h+='<div class="o'+(A[cur]===n?' sel':'')+'" data-n="'+n+'"><span class="r"></span><span>'+fmt(o)+'</span></div>'});
 $('body').innerHTML=h;$('no').textContent=cur+1;
 $('bmp').setAttribute('fill',M[cur]?'#111':'none');
 $('pv').disabled=cur==0;$('nx').disabled=cur>=Q.length-1;
 grid();
}
function editor(){
 $('nav').style.display='none';$('ed').style.display='none';$('no').textContent='✎';
 $('body').innerHTML='<div class="f"><label>Nama<input id="f1" value="'+esc(D.nama).replace(/"/g,'&quot;')+'"></label><label>Email<input id="f2" value="'+esc(D.email).replace(/"/g,'&quot;')+'"></label><label>Judul TO<input id="f3" value="'+esc(D.judul).replace(/"/g,'&quot;')+'"></label><label>Subtes<input id="f4" value="'+esc(D.sub).replace(/"/g,'&quot;')+'"></label></div>'
 +'<div class="lb">Daftar soal (tempel di sini)</div><textarea id="ta" spellcheck="false"></textarea>'
 +'<div class="gd">Format: <code>Teks:</code> bacaan (boleh kosong atau banyak baris; <code>Teks: =</code> artinya sama dengan soal sebelumnya), <code>Soal:</code> pertanyaan, lalu pilihan <code>A.</code> <code>B.</code> <code>C.</code> dst. Pisahkan antarsoal dengan baris <code>---</code>. Miring: <code>*teks*</code>, tebal: <code>**teks**</code>. Tip: minta Claude membuat soal dalam format ini, lalu tempel.</div>'
 +'<div class="row"><button class="btn p" id="ap">Terapkan &amp; Mulai</button><button class="btn" id="bt">Batal</button><span class="cnt" id="ct"></span></div>';
 var ta=$('ta');ta.value=D.raw;
 var cnt=function(){$('ct').textContent=parse(ta.value).length+' soal terbaca'};cnt();ta.oninput=cnt;
 $('bt').onclick=function(){edit=false;soal()};
 $('ap').onclick=function(){
  D.nama=$('f1').value;D.email=$('f2').value;D.judul=$('f3').value;D.sub=$('f4').value;
  if(ta.value!==D.raw){D.raw=ta.value;D.A=[];D.M=[];cur=0}
  load();save();edit=false;soal();
 };
}
function persist(){D.A=A;D.M=M;save()}
function hasil(){
 var L=[],c=0;
 Q.forEach(function(_,i){if(A[i]>=0)c++;L.push((i+1)+'. '+(A[i]>=0?String.fromCharCode(65+A[i]):'-'))});
 return D.judul+' | '+D.sub+'\nTerjawab: '+c+'/'+Q.length+'\n\n'+L.join('\n');
}
$('grid').onclick=function(e){var b=e.target.closest('.nb');if(b){edit=false;cur=+b.dataset.i;soal();}};
$('body').onclick=function(e){
 if(edit)return;
 var o=e.target.closest('.o');if(o){var n=+o.dataset.n;A[cur]=A[cur]===n?-1:n;persist();soal();}
};
$('bm').onclick=function(){if(edit||!Q.length)return;M[cur]=!M[cur];persist();soal();};
$('pv').onclick=function(){if(cur>0){cur--;soal();}};
$('nx').onclick=function(){if(cur<Q.length-1){cur++;soal();}};
function openEd(){edit=true;soal();$('body').scrollIntoView({behavior:'smooth'});}
$('ed').onclick=openEd;$('ed2').onclick=openEd;
$('fin').onclick=function(){$('res').value=hasil();$('ov').classList.add('on');};
$('cl').onclick=function(){$('ov').classList.remove('on')};
$('rs').onclick=function(){if(confirm('Hapus semua jawaban?')){A=Q.map(function(){return-1});M=Q.map(function(){return false});persist();$('ov').classList.remove('on');soal();}};
$('cp').onclick=function(){
 var t=$('res'),ok=function(){$('cp').textContent='Tersalin ✓'};
 t.focus();t.select();
 try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(ok,function(){document.execCommand('copy')&&ok()});return}}catch(e){}
 try{document.execCommand('copy')&&ok()}catch(e){}
};
load();soal();
</script>
</body>
</html>
